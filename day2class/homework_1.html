<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質數動態展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle at top, #2f3640 0%, #14151a 55%, #05060a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #e5e5e5;
        }

        .container {
            text-align: center;
            background: rgba(15, 17, 25, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px 26px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(120, 120, 140, 0.4);
            max-width: 900px;
            width: 95%;
        }

        h1 {
            color: #f5f5f5;
            font-size: 2.1em;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .subtitle {
            color: #b0b4c3;
            font-size: 1.02em;
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        label {
            color: #d0d3de;
            font-size: 0.98em;
        }

        input[type="number"] {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #3b3f4f;
            outline: none;
            font-size: 1em;
            width: 130px;
            text-align: center;
            background-color: #1f2230;
            color: #f5f5f5;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        input[type="number"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.4);
        }

        .hint {
            color: #7f8499;
            font-size: 0.86em;
        }

        .prime-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 800px;
            min-height: 200px;
            padding-top: 6px;
        }

        .prime-item {
            width: 60px;
            height: 60px;
            background: #222633;
            border-radius: 10px;
            border: 1px solid #3b4254;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25em;
            font-weight: 600;
            color: #f1f3ff;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                box-shadow 0.3s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                opacity 0.3s ease,
                color 0.25s ease;
            transform: translateY(40px);
            opacity: 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
        }

        .prime-item:nth-child(even) {
            background: #1d212e;
        }

        .prime-item:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.9);
            border-color: #6366f1;
            background: #252a3a;
        }

        /* 點擊後「反白」效果：底色偏亮、文字偏深色 */
        .prime-item.selected {
            background: #f4f4f5;
            color: #111827;
            border-color: #9ca3af;
            box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.8);
            transform: translateY(-4px) scale(1.03);
        }

        .prime-item.animate {
            animation: squareIn 0.55s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes squareIn {
            0% {
                transform: scale(0.4) translateY(40px);
                opacity: 0;
            }

            60% {
                transform: scale(1.08) translateY(-4px);
                opacity: 1;
            }

            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .stats {
            margin-top: 16px;
            color: #c4c7d4;
            font-size: 0.98em;
        }

        .count {
            color: #facc15;
            font-size: 1.1em;
            font-weight: 600;
        }

        .limit {
            color: #e5e7eb;
            font-weight: 600;
        }

        .error {
            margin-top: 8px;
            color: #fca5a5;
            min-height: 1.2em;
            font-size: 0.88em;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #818cf8;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0.9;
            animation: particleFloat 0.9s ease-out forwards;
        }

        .particle:nth-child(odd) {
            background: #38bdf8;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.9;
            }

            100% {
                transform: translateY(-80px) scale(0.2);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>質數黑夜劇場</h1>
        <p class="subtitle">輸入一個正整數，看看在這個數字之前有哪些質數會在暗夜中出場。</p>

        <div class="form-row">
            <label for="limitInput">顯示多少以內的質數：</label>
            <input id="limitInput" type="number" min="2" max="1000" step="1" value="100">
            <span class="hint">(有效範圍：2 ~ 1000)</span>
        </div>

        <div class="prime-container" id="primeContainer"></div>

        <div class="stats">
            目前顯示 <span class="count" id="primeCount">0</span> 個質數，
            <span class="limit" id="currentLimit">0</span> 以內的質數。
        </div>
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        const container = document.getElementById('primeContainer');
        const countSpan = document.getElementById('primeCount');
        const limitSpan = document.getElementById('currentLimit');
        const errorMsg = document.getElementById('errorMsg');
        const limitInput = document.getElementById('limitInput');

        // 使用篩法求質數。[web:6][web:11][web:14][web:33]
        function sieveOfEratosthenes(n) {
            const isPrime = new Array(n + 1).fill(true);
            isPrime[0] = isPrime[1] = false;

            for (let i = 2; i * i <= n; i++) {
                if (isPrime[i]) {
                    for (let j = i * i; j <= n; j += i) {
                        isPrime[j] = false;
                    }
                }
            }

            return Array.from({ length: n + 1 }, (_, i) => i).filter(i => isPrime[i]);
        }

        function createPrimeElement(num) {
            const div = document.createElement('div');
            div.className = 'prime-item';
            div.textContent = num;

            // 點擊時切換 selected 類別，達到反白效果。[web:28][web:32][web:35]
            div.addEventListener('click', () => {
                div.classList.toggle('selected');
            });

            return div;
        }

        function createParticles(element) {
            const rect = element.getBoundingClientRect();
            const particleCount = 6;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = rect.left + rect.width / 2 + 'px';
                particle.style.top = rect.top + rect.height / 2 + 'px';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 900);
            }
        }

        function renderPrimes(limit) {
            container.innerHTML = '';
            errorMsg.textContent = '';
            limitSpan.textContent = limit;

            if (limit < 2) {
                countSpan.textContent = 0;
                errorMsg.textContent = '請輸入介於 2 到 1000 之間的數字。';
                return;
            }

            const primes = sieveOfEratosthenes(limit);
            countSpan.textContent = primes.length;

            primes.forEach((prime, index) => {
                const element = createPrimeElement(prime);
                container.appendChild(element);
                setTimeout(() => {
                    element.classList.add('animate');
                    createParticles(element);
                }, index * 70);
            });
        }

        // 限制範圍在 2 ~ 1000 之間。[web:22][web:25]
        limitInput.addEventListener('input', () => {
            const value = parseInt(limitInput.value, 10);

            if (Number.isNaN(value)) {
                container.innerHTML = '';
                countSpan.textContent = '0';
                limitSpan.textContent = '0';
                errorMsg.textContent = '請輸入有效的數字（2 ~ 1000）。';
                return;
            }

            if (value > 1000) {
                errorMsg.textContent = '範圍僅支援 1000 以內，已自動調整為 1000。';
                limitInput.value = 1000;
                renderPrimes(1000);
            } else if (value < 2) {
                container.innerHTML = '';
                countSpan.textContent = '0';
                limitSpan.textContent = value;
                errorMsg.textContent = '請輸入介於 2 到 1000 之間的數字。';
            } else {
                renderPrimes(value);
            }
        });

        // 頁面載入時預設顯示 100 以內的質數。
        window.addEventListener('load', () => {
            renderPrimes(parseInt(limitInput.value, 10));
        });
    </script>
</body>

</html>
